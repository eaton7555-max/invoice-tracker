<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Landscape Jobs</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Landscape">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c1f17;
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .summary { display: flex; gap: 10px; margin-bottom: 16px; font-size: 0.85rem; }
    .summary div { background: #14291f; padding: 10px 12px; border-radius: 12px; flex: 1; }
    .summary .label { color: #86efac; font-size: 0.7rem; }
    .add-form, .job {
      background: #14291f;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    input, select, button, textarea {
      font-family: inherit;
      font-size: 1rem;
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 100%;
      margin-bottom: 8px;
    }
    input, select, textarea { background: #0c1f17; color: white; }
    textarea { min-height: 60px; resize: vertical; }
    button.add, button.line, button.export {
      background: #059669;
      color: white;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      padding: 10px 16px;
    }
    button.line { font-size: 0.85rem; margin-bottom: 12px; }
    button.export { margin: 8px 0 16px; background: #1e3a2f; }
    .line-item { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .line-item select, .line-item input { margin: 0; flex: 1; }
    .line-item .qty { max-width: 70px; }
    .line-item .price { max-width: 90px; }
    .job .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .job .client { font-weight: 600; }
    .job .amount { color: #86efac; font-weight: 600; }
    .job .meta { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .job .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .job button { width: auto; padding: 6px 12px; font-size: 0.85rem; background: #059669; color: white; }
    .lines { font-size: 0.8rem; color: #cbd5e1; margin-top: 6px; }
    #exportBox {
      display: none;
      background: #14291f;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    #exportBox textarea { min-height: 140px; font-size: 0.8rem; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Landscape Jobs</h1>
  <div class="summary">
    <div><div class="label">Received</div><div id="received">$0</div></div>
    <div><div class="label">Pending</div><div id="pending">$0</div></div>
  </div>

  <div class="add-form">
    <input id="client" placeholder="Customer name" />
    <input id="address" placeholder="Customer address" />
    <input id="phone" placeholder="Phone (optional)" />
    <input id="email" placeholder="Email (optional)" />
    <input id="crew" placeholder="Crew name" />
    <div id="lines"></div>
    <button class="line" type="button" id="addLine">+ Add line item</button>
    <input id="countyTax" type="number" step="0.01" placeholder="County tax % (e.g. 7.5)" value="0" />
    <textarea id="notes" placeholder="Notes (access, photos link, special instructions…)"></textarea>
    <button class="add" id="save">Save Job</button>
  </div>

  <button class="export" id="exportBtn">Export for Google Sheets</button>
  <div id="exportBox">
    <p style="margin-bottom:8px; font-size:0.85rem;">Copy everything below, then paste into the Google Sheet (starting at row 2):</p>
    <textarea id="exportText" readonly></textarea>
    <button class="add" id="copyBtn">Copy to Clipboard</button>
  </div>

  <div id="list"></div>

  <script>
    const { jsPDF } = window.jspdf;
    const SERVICES = [
      "Mowing", "Edging", "Planting", "Mulching", "Landscape",
      "Seasonal cleanup", "Tree trimming", "Irrigation", "Hardscape",
      "Fertilizing", "Leaf removal", "Fountain", "Lawn ornament", "Other"
    ];
    const KEY = "landscape-jobs-v1";

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }
    function save(items) {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function money(n) {
      return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function addLineRow(service = "Mowing", qty = 1, price = "") {
      const div = document.createElement("div");
      div.className = "line-item";
      div.innerHTML = `
        <select class="svc">${SERVICES.map(s => `<option ${s===service?"selected":""}>${s}</option>`).join("")}</select>
        <input class="qty" type="number" step="1" min="1" value="${qty}" placeholder="Qty" />
        <input class="price" type="number" step="0.01" value="${price}" placeholder="$" />
      `;
      document.getElementById("lines").appendChild(div);
    }

    function getLines() {
      return Array.from(document.querySelectorAll(".line-item")).map(row => ({
        service: row.querySelector(".svc").value,
        qty: parseFloat(row.querySelector(".qty").value) || 1,
        price: parseFloat(row.querySelector(".price").value) || 0
      })).filter(l => l.price > 0);
    }

    function calc(job) {
      const subtotal = (job.lines || []).reduce((sum, l) => sum + (l.qty * l.price), 0);
      const tax = subtotal * ((job.countyTax || 0) / 100);
      return { subtotal, tax, total: subtotal + tax };
    }

    function makeInvoice(job) {
      const c = calc(job);
      const doc = new jsPDF();
      const date = new Date(job.created).toLocaleDateString();

      doc.setFontSize(20);
      doc.text("INVOICE", 20, 25);
      doc.setFontSize(11);
      doc.text(`Date: ${date}`, 20, 35);

      doc.text(`Bill To:`, 20, 48);
      doc.setFontSize(12);
      doc.text(job.client, 20, 55);
      doc.setFontSize(10);
      if (job.address) {
        const addrLines = doc.splitTextToSize(job.address, 80);
        doc.text(addrLines, 20, 61);
      }
      if (job.phone) doc.text(job.phone, 20, 75);
      if (job.email) doc.text(job.email, 20, 81);

      if (job.crew) {
        doc.setFontSize(11);
        doc.text(`Crew: ${job.crew}`, 120, 48);
      }

      let y = 95;
      doc.setFontSize(12);
      doc.text("Description", 20, y);
      doc.text("Qty", 110, y);
      doc.text("Price", 140, y);
      doc.text("Amount", 170, y);
      y += 6;
      doc.setLineWidth(0.2);
      doc.line(20, y, 190, y);
      y += 8;

      (job.lines || []).forEach(line => {
        const amt = line.qty * line.price;
        doc.setFontSize(10);
        doc.text(line.service, 20, y);
        doc.text(String(line.qty), 110, y);
        doc.text(money(line.price), 140, y);
        doc.text(money(amt), 170, y);
        y += 7;
      });

      y += 4;
      doc.line(20, y, 190, y);
      y += 10;
      doc.setFontSize(11);
      doc.text(`Subtotal: ${money(c.subtotal)}`, 130, y);
      y += 7;
      if (job.countyTax > 0) {
        doc.text(`County tax (${job.countyTax}%): ${money(c.tax)}`, 130, y);
        y += 7;
      }
      doc.setFontSize(13);
      doc.text(`Total Due: ${money(c.total)}`, 130, y);

      if (job.notes) {
        y += 15;
        doc.setFontSize(10);
        doc.text("Notes:", 20, y);
        y += 6;
        const split = doc.splitTextToSize(job.notes, 170);
        doc.text(split, 20, y);
      }

      doc.save(`Invoice-${job.client.replace(/\s+/g, "-")}.pdf`);
    }

    function render() {
      const jobs = load();
      let received = 0, pending = 0;
      const list = document.getElementById("list");
      list.innerHTML = "";

      jobs.forEach(job => {
        const c = calc(job);
        if (job.status === "paid") received += c.total;
        else if (job.status === "invoiced") pending += c.total;

        const div = document.createElement("div");
        div.className = "job";
        let actions = `<button data-id="${job.id}" data-action="pdf">View Invoice</button>`;
        if (job.status === "quote") actions += `<button data-id="${job.id}" data-action="start">Start Work</button>`;
        else if (job.status === "wip") actions += `<button data-id="${job.id}" data-action="invoice">Raise Invoice</button>`;
        else if (job.status === "invoiced") actions += `<button data-id="${job.id}" data-action="paid">Mark Paid</button>`;

        const linesText = (job.lines || []).map(l => `${l.qty}× ${l.service} @ ${money(l.price)}`).join("<br>");

        div.innerHTML = `
          <div class="top">
            <div>
              <div class="client">${job.client}</div>
              <div class="meta">${job.crew || "No crew"} · ${job.status.toUpperCase()}${job.countyTax ? " · " + job.countyTax + "% tax" : ""}</div>
              ${job.address ? `<div class="meta">${job.address}</div>` : ""}
              <div class="lines">${linesText || "No line items"}</div>
              ${job.notes ? `<div class="meta">Notes: ${job.notes}</div>` : ""}
            </div>
            <div class="amount">${money(c.total)}</div>
          </div>
          <div class="actions">${actions}</div>
        `;
        list.appendChild(div);
      });

      document.getElementById("received").textContent = money(received);
      document.getElementById("pending").textContent = money(pending);

      list.querySelectorAll("button").forEach(btn => {
        btn.onclick = () => action(btn.dataset.id, btn.dataset.action);
      });
    }

    function action(id, act) {
      const jobs = load();
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      if (act === "pdf") {
        makeInvoice(job);
        return;
      }
      if (act === "start") job.status = "wip";
      else if (act === "invoice") {
        job.status = "invoiced";
        job.invoiceDate = Date.now();
      }
      else if (act === "paid") job.status = "paid";
      save(jobs);
      render();
    }

    document.getElementById("addLine").onclick = () => addLineRow();
    document.getElementById("save").onclick = () => {
      const client = document.getElementById("client").value.trim();
      const lines = getLines();
      if (!client || lines.length === 0) return alert("Need a customer and at least one line item with a price");
      const jobs = load();
      jobs.push({
        id: Date.now().toString(),
        client,
        address: document.getElementById("address").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        crew: document.getElementById("crew").value.trim(),
        lines,
        countyTax: parseFloat(document.getElementById("countyTax").value) || 0,
        notes: document.getElementById("notes").value.trim(),
        status: "quote",
        created: Date.now()
      });
      save(jobs);
      document.getElementById("client").value = "";
      document.getElementById("address").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("email").value = "";
      document.getElementById("crew").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("lines").innerHTML = "";
      addLineRow();
      render();
    };

    document.getElementById("exportBtn").onclick = () => {
      const jobs = load();
      if (jobs.length === 0) return alert("No jobs to export yet");
      const rows = jobs.map(job => {
        const c = calc(job);
        const services = (job.lines || []).map(l => `${l.qty}x ${l.service} @ $${l.price}`).join("; ");
        const date = new Date(job.created).toISOString().slice(0, 10);
        return [
          date,
          job.client,
          job.address || "",
          job.phone || "",
          job.email || "",
          job.crew || "",
          job.status,
          services,
          c.subtotal.toFixed(2),
          job.countyTax || 0,
          c.tax.toFixed(2),
          c.total.toFixed(2),
          job.notes || ""
        ].join("\t");
      });
      document.getElementById("exportText").value = rows.join("\n");
      document.getElementById("exportBox").style.display = "block";
    };

    document.getElementById("copyBtn").onclick = () => {
      const text = document.getElementById("exportText");
      text.select();
      text.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(text.value).then(() => {
        alert("Copied! Open the Google Sheet and paste starting at row 2.");
      }).catch(() => {
        document.execCommand("copy");
        alert("Copied! Open the Google Sheet and paste starting at row 2.");
      });
    };

    addLineRow();
    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
